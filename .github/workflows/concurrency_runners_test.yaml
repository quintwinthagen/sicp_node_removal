name: Runner concurrency test
on:
  workflow_dispatch:

jobs:
  parallel:
    runs-on: [self-hosted, linux, x64, sim, docker]
    container: python:3.12-slim
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        i: [1, 2, 3, 4]
    steps:
      - name: Identify runner
        run: |
          echo "Job index: ${{ matrix.i }}"
          echo "Runner name: $RUNNER_NAME"
          echo "Host: $(hostname)"
          python -c "import os; print('cpu_count:', os.cpu_count())"
      - name: Hold slot for 90s
        run: sleep 90
