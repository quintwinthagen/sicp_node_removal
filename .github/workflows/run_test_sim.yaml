name: Run Simulation

on:
  workflow_dispatch:

jobs:
  run-sim:
    runs-on: [self-hosted, linux, x64, sim, docker]
    timeout-minutes: 1440
    container:
      image: python:3.12-slim
      options: --volume /srv:/srv

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip install uv
          uv sync

      - name: Prepare output directory
        run: |
          OUTPUT_DIR="/srv/sim_outputs/run_${{ github.run_id }}"
          mkdir -p "$OUTPUT_DIR"
          echo "OUTPUT_DIR=$OUTPUT_DIR" >> $GITHUB_ENV
          echo "Using output dir: $OUTPUT_DIR"

      - name: Run simulation
        run: |
          uv run python -m sim_configs.test_sim \
            -o "$OUTPUT_DIR"

      - name: Verify output
        run: |
          ls -R "$OUTPUT_DIR"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: sim-results-${{ github.run_id }}
          path: ${{ env.OUTPUT_DIR }}
