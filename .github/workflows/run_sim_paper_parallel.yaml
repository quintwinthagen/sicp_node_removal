name: Run Simulations for Paper (3 parallel)

on:
  workflow_dispatch:

jobs:
  run-sim:
    runs-on: [self-hosted, linux, x64, sim, docker]
    timeout-minutes: 1440

    strategy:
      matrix:
        sim_name:
          - sim_paper_1
          - sim_paper_2
          - sim_paper_3

    container:
      image: python:3.12-slim
      options: --volume /srv:/srv

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip install uv
          uv sync

      - name: Prepare output directory
        run: |
          OUTPUT_DIR="/srv/sim_outputs/${{ matrix.sim_name }}_run_${{ github.run_id }}"
          mkdir -p "$OUTPUT_DIR"
          echo "OUTPUT_DIR=$OUTPUT_DIR" >> $GITHUB_ENV
          echo "Using output dir: $OUTPUT_DIR"

      - name: Run simulation
        run: |
          uv run python -m sim_configs.${{ matrix.sim_name }} \
            -o "$OUTPUT_DIR"

      - name: Verify output
        run: |
          ls -R "$OUTPUT_DIR"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: sim-results-${{ matrix.sim_name }}-${{ github.run_id }}
          path: ${{ env.OUTPUT_DIR }}
